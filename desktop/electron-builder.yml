appId: dev.conductor.app
productName: Conductor
copyright: Copyright © 2026 the Conductor Authors and RockSolid Labs, Inc.
directories:
  output: release
  buildResources: build
protocols:
  - name: Conductor invite
    schemes: [conductor]
files:
  - dist/**/*
  - static/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: static
    to: static
  # The licence and the notices of what the app ships (scripts/notices.py), beside Electron's LICENSES.chromium.html.
  - from: ../LICENSE
    to: LICENSE
  - from: ../NOTICE
    to: NOTICE
  - from: ../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
asar: true
compression: normal
publish:
  provider: github
  owner: phenixrizen
  repo: conductor
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: ../bin/desktop/mac-${arch}/conductor
      to: conductor
  binaries:
    - Contents/Resources/conductor
dmg:
  sign: false
linux:
  category: Development
  maintainer: conductor@phenixrizen.dev
  synopsis: Coding agents in shared terminals
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
  extraResources:
    - from: ../bin/desktop/linux-${arch}/conductor
      to: conductor
win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    # No Windows server: the Linux binary runs inside the user's WSL 2 distribution.
    - from: ../bin/desktop/linux-x64/conductor
      to: conductor-linux
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh
  # Our own artwork in place of electron-builder's stock bitmaps (scripts/installer-art.mjs renders them):
  # the welcome and finish pages' sidebar with the lockup and the sponsor badge, the other pages' header with the lockup.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
