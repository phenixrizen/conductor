<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="color-scheme" content="dark" />
    <title>Conductor</title>
    <style>
      /* The switchyard pages' dark palette (docs/design/brand.md); the sponsor badge is the Sponsor Kit's 1a, dark. */
      :root { --surface: #18181b; --border: #27272a; --text: #ffffff; --body: #e4e4e7; --muted: #a1a1aa; --mark: #eef1e9; --junction: #d26b3f; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--surface); color: var(--body); font: 14px/1.5 Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; -webkit-app-region: drag; user-select: none; display: flex; flex-direction: column; border: 1px solid var(--border); }
      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 32px 12px; }
      .lockup { display: flex; align-items: center; gap: 12px; }
      .word { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
      .build { font: 12px/1.4 'JetBrains Mono', ui-monospace, Consolas, monospace; color: var(--muted); text-align: center; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }
      .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--mark); animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
      a.badge { -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid #333; border-radius: 6px; background: #000; text-decoration: none; }
      a.badge span { font: 700 11px 'PT Sans', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; color: #999; }
      a.badge img { height: 20px; width: auto; display: block; }
      a.badge:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="lockup">
        <svg viewBox="0 0 256 256" width="48" height="48" aria-hidden="true"><g fill="#eef1e9"><path d="M198 39.5H124A88.5 88.5 0 0 0 124 216.5H204A8.5 8.5 0 0 0 204 199.5H124A71.5 71.5 0 0 1 124 56.5H181Z"></path><path d="M199 63.5L176 86.5Q170 92.5 167 92.5H124A35.5 35.5 0 0 0 124 163.5H204A8.5 8.5 0 0 1 204 180.5H124A52.5 52.5 0 0 1 124 75.5H164.5L176.5 63.5Z"></path></g><path fill="#d26b3f" d="M204 39.5H236L216 59.5H184Z"></path></svg>
        <span class="word">Conductor</span>
      </div>
      <div class="build" id="build"></div>
      <div class="status" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span><span id="status">Starting…</span></div>
    </main>
    <footer>
      <span id="copyright"></span>
      <a class="badge" href="https://rocksolidlabs.io" id="credit" title=""><span>Sponsored by</span><img src="sponsor/rocksolidlabs-logo-reversed.png" alt="RockSolid Labs" /></a>
    </footer>
    <script>
      const q = new URLSearchParams(location.search)
      document.getElementById('build').textContent = q.get('build') || q.get('version') || ''
      document.getElementById('copyright').textContent = q.get('copyright') || ''
      const credit = q.get('credit') || ''
      const a = document.getElementById('credit')
      a.title = credit
      a.setAttribute('aria-label', credit)
      window.setStatus = (t) => { if (t) document.getElementById('status').textContent = t }
    </script>
  </body>
</html>
