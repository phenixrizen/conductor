components:
  securitySchemes:
    BrowserCookie:
      type: apiKey
      in: cookie
      name: __Host-conductor-session
      description: Configured browser login only. Secure HttpOnly host-only session; cannot be combined with bearer or local credentials. Cookie mutations also require exact Origin and X-Conductor-CSRF. A supplied CSRF header is checked on reads, protecting stale tabs after account changes.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RFC 9068 RS256 JWT access token
      description: OIDC mode only; exact configured issuer and audience, at+jwt type, and signed required claims. ID tokens are not accepted.
    LocalActor:
      type: apiKey
      in: header
      name: X-Conductor-Actor
      description: Local development only. Not authentication and rejected in OIDC mode.
  responses:
    CollectionCapacity: {description: Finite admission capacity exhausted (capacity_exceeded); existing requests are not evicted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    CollectionStopped: {description: Collection no longer permits new work (collection_stopped), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    BadRequest: {description: Invalid command or query parameters, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Token or local identity missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Workspace membership or repository capability denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: "Change, revision, or collection missing or inaccessible", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Inspected revision is stale, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalError: {description: Internal error with details withheld, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: Requested service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  parameters:
    CollectionID: {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
    CollectionWorkspace: {name: X-Conductor-Workspace, in: header, required: true, description: Selected canonical workspace; current membership is checked on the server, schema: {type: string, minLength: 1, maxLength: 128}}
    CollectionRepository: {name: X-Conductor-Repository, in: header, required: true, description: Selected canonical repository; labels or provider URLs cannot replace this identity, schema: {type: string, minLength: 1, maxLength: 128}}
    CollectionKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one 1-128 byte printable ASCII value without whitespace or comma; reuse the same key and input to reconcile an uncertain request
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}$'}
    BrowserOrigin:
      name: Origin
      in: header
      description: Required for cookie-authenticated commands; must equal the configured public HTTPS origin. Browser clients set this automatically.
      schema: {type: string, format: uri}
    CSRF:
      name: X-Conductor-CSRF
      in: header
      description: Required for cookie-authenticated commands. Browser clients also send it on reads to bind inspection to their bootstrapped session. Never store in a URL or persistent browser storage.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    ID: {name: id, in: path, required: true, schema: {type: string}}
    Actor: {name: X-Conductor-Actor, in: header, required: false, description: Required only in local mode; rejected in OIDC mode, schema: {type: string, maxLength: 128}}
    Workspace:
      name: X-Conductor-Workspace
      in: header
      description: Required for OIDC package and repository operations; selected scope is not proof of membership. At most 128 UTF-8 bytes.
      schema: {type: string, maxLength: 128}
    Repository:
      name: X-Conductor-Repository
      in: header
      description: Canonical repository ID. Required for OIDC package creation; optionally narrows every other package operation. Immutable package ownership is separate from content labels.
      schema: {type: string, maxLength: 128}
    BeforeRevision:
      name: beforeRevision
      in: query
      description: Exclusive revision-number cursor; zero starts at the latest revision
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    AfterSequence:
      name: afterSequence
      in: query
      description: Exclusive audit-sequence cursor; zero starts at the first event
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    HistoryLimit:
      name: limit
      in: query
      description: Maximum number of entries in one page
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  schemas:
    CollectionInput:
      type: object
      additionalProperties: false
      required: [commit, paths]
      properties:
        fullSource: {type: boolean, default: false, description: Also acquire a bounded exact Git bundle and whole-tree CodeGraph index as separate immutable facts; requires configured CodeGraph worker}
        commit: {type: string, pattern: '^[a-f0-9]{40}$', description: Exact supported SHA-1 commit object ID; no branch names or abbreviated IDs}
        paths:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Unique explicit clean relative file paths, sorted bytewise before hashing; no traversal, backslashes, leading dash, or control characters
          items: {type: string, minLength: 1, maxLength: 1024, description: At most 1024 UTF-8 bytes}
    ContextSource:
      type: object
      additionalProperties: false
      required: [workspaceId, repositoryId, provider, host, providerId, locator, profile, integrationVersion]
      properties:
        workspaceId: {type: string}
        repositoryId: {type: string}
        provider: {type: string, enum: [github, gitlab]}
        host: {type: string, enum: [github.com, gitlab.com]}
        providerId: {type: string, pattern: '^[1-9][0-9]*$', description: Stable canonical provider repository or project ID}
        locator: {type: string, description: Operator-selected GitHub owner/name; empty for GitLab's stable numeric project ID}
        profile: {type: string, enum: ['github-rest/2026-03-10', 'gitlab-rest/v4-19.3']}
        integrationVersion: {type: integer, format: int64, minimum: 1, description: Integration configuration version bound when the request was persisted}
    CollectionExecution:
      type: object
      additionalProperties: false
      required: [namespace, workflowId, runId, state, observedAt, current]
      description: Last recorded Temporal observation, separate from request facts and receipt coverage; absence means progress is unknown
      properties:
        namespace: {type: string, description: Recorded Temporal namespace; part of immutable execution identity}
        workflowId: {type: string}
        runId: {type: string, description: Recorded workflow run identity; may be empty before a run is established}
        state: {type: string, description: Observed workflow state; does not establish artifact completeness, passing checks, approval, merge, or deployment}
        observedAt: {type: string, format: date-time}
        current: {type: boolean, description: True only for a supported observation less than 30 seconds old; false includes stale, unavailable, or unresolved progress}
    ContextArtifact:
      type: object
      required: [path, state]
      properties:
        path: {type: string, maxLength: 1024}
        state: {type: string, enum: [collected, missing, unavailable, truncated]}
        blobOID: {type: string, pattern: '^[a-fA-F0-9]{40}$', description: Present for collected/truncated source; absent for missing paths}
        digest: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of complete UTF-8 text; present only when collected}
        text: {type: string, maxLength: 65536, description: Complete UTF-8 text of at most 64 KiB; omitted for missing/unavailable/truncated artifacts}
        message: {type: string, maxLength: 1024, description: Required bounded reason for missing/unavailable/truncated artifacts; at most 1024 bytes}
    RemoteContextSnapshot:
      type: object
      required: [schemaVersion, repository, commit, requestedRef, collectedAt, collector, artifacts, collectionId, source]
      description: Version 2 remote snapshot; existing version 1 local snapshots and their immutable digests remain unchanged. Combined artifact text is limited to 256 KiB.
      properties:
        schemaVersion: {type: integer, const: 2}
        repository: {type: string, maxLength: 1024, description: Descriptive source label; canonical ownership comes from source and the stored receipt}
        commit: {type: string, pattern: '^[a-f0-9]{40}$'}
        requestedRef: {type: string, pattern: '^[a-f0-9]{40}$', description: Equal to the selected full commit; no later reference resolution}
        collectedAt: {type: string, format: date-time}
        collector: {type: string, const: conductor-remote/v1}
        collectionId: {type: string, pattern: '^[a-f0-9]{32}$'}
        source: {$ref: '#/components/schemas/ContextSource'}
        artifacts: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/ContextArtifact'}}
    CollectionReceipt:
      type: object
      additionalProperties: false
      required: [id, digest, snapshot, createdAt]
      description: First committed immutable result for this collection. Workflow completion can retain missing, unavailable, or truncated source.
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$', description: Equal to the collection ID}
        digest: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 digest of the persisted snapshot representation}
        snapshot: {$ref: '#/components/schemas/RemoteContextSnapshot'}
        createdAt: {type: string, format: date-time}
    Collection:
      type: object
      additionalProperties: false
      required: [id, workspaceId, repositoryId, requesterId, input, inputDigest, source, createdAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        workspaceId: {type: string}
        repositoryId: {type: string}
        requesterId: {type: string, description: Server-derived principal ID, retained as historical attribution}
        input: {$ref: '#/components/schemas/CollectionInput'}
        inputDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        source: {$ref: '#/components/schemas/ContextSource'}
        createdAt: {type: string, format: date-time}
        cancelRequestedAt: {type: string, format: date-time, description: Durable cancellation intent; not confirmation that execution stopped}
        receipt: {$ref: '#/components/schemas/CollectionReceipt'}
        fullSource: {$ref: '#/components/schemas/SourceBundleSummary'}
        execution: {$ref: '#/components/schemas/CollectionExecution'}
    CollectionSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, repositoryId, requesterId, commit, createdAt]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        workspaceId: {type: string}
        repositoryId: {type: string}
        requesterId: {type: string}
        commit: {type: string, pattern: '^[a-f0-9]{40}$'}
        createdAt: {type: string, format: date-time}
        cancelRequestedAt: {type: string, format: date-time}
        receiptDigest: {type: string, pattern: '^[a-f0-9]{64}$', description: Present only when an immutable receipt exists; inspect the collection for actual coverage}
        execution: {$ref: '#/components/schemas/CollectionExecution'}
    CollectionPage:
      type: object
      additionalProperties: false
      required: [collections]
      properties:
        collections: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CollectionSummary'}}
        nextBefore: {type: string, maxLength: 1024, description: Opaque cursor when further matching records exist; omitted otherwise}
    BrowserSession:
      type: object
      required: [session, csrfToken]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        csrfToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    Session:
      type: object
      required: [principal, workspaces, truncated]
      properties:
        principal:
          type: object
          required: [id, kind]
          properties:
            id: {type: string}
            kind: {type: string, enum: [human, agent]}
        workspaces:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
        truncated: {type: boolean}
    ManagedRepository:
      type: object
      required: [id, workspaceId, provider, host, providerId, name, canRead, canAuthor, canApprove]
      properties:
        id: {type: string}
        workspaceId: {type: string}
        provider: {type: string, enum: [github, gitlab]}
        host: {type: string}
        providerId: {type: string}
        name: {type: string}
        canRead: {type: boolean}
        canAuthor: {type: boolean}
        canApprove: {type: boolean, description: Always false for an agent principal}
    RepositoryPage:
      type: object
      required: [repositories, truncated]
      properties:
        repositories: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ManagedRepository'}}
        truncated: {type: boolean}
    ChangeSummary:
      type: object
      required: [id, revision, digest, author, createdAt, approved]
      additionalProperties: false
      properties:
        id: {type: string}
