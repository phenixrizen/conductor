    RuntimeEvidence:
      type: object
      additionalProperties: false
      required:
      - id
      - workspaceId
      - repositoryId
      - requesterId
      - input
      - digest
      - target
      - deployment
      - criteria
      - createdAt
      - freshness
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        workspaceId:
          type: string
          maxLength: 128
        repositoryId:
          type: string
          maxLength: 128
        requesterId:
          type: string
          maxLength: 128
        input:
          $ref: '#/components/schemas/RuntimeInput'
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        target:
          $ref: '#/components/schemas/RuntimeTarget'
        deployment:
          $ref: '#/components/schemas/ProviderDeployment'
        criteria:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/RuntimeCriterionLink'
        createdAt:
          type: string
          format: date-time
        receipt:
          $ref: '#/components/schemas/RuntimeReceipt'
        execution:
          $ref: '#/components/schemas/CollectionExecution'
        freshness:
          type: string
          enum:
          - not_collected
          - current
          - stale
    RuntimeSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - deliveryId
      - repositoryId
      - environment
      - commit
      - digest
      - createdAt
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        deliveryId:
          type: string
          pattern: ^[a-f0-9]{32}$
        repositoryId:
          type: string
          maxLength: 128
        environment:
          type: string
          maxLength: 128
        commit:
          type: string
          pattern: ^[a-f0-9]{40}$
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        createdAt:
          type: string
          format: date-time
        receiptDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
    RuntimePage:
      type: object
      additionalProperties: false
      required:
      - evidence
      properties:
        evidence:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuntimeSummary'
        nextBefore:
          type: string
          maxLength: 1024
    VerificationCriteria:
      type: object
      additionalProperties: false
      description: Optional package content under verificationCriteria. Interpreted for explicit links and historical inspection; other content/extensions retain their original digest and meaning. Bounded to 32 KiB encoded JSON.
      required: [schemaVersion, criteria]
      properties:
        schemaVersion: {type: integer, const: 1}
        criteria:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, description]
            properties:
              id: {type: string, pattern: '^[A-Za-z0-9._-]{1,64}$'}
              description: {type: string, minLength: 1, maxLength: 4096}
    VerificationRequirement:
      type: object
      additionalProperties: false
      required: [changeId, revision, digest, criterionId]
      properties:
        changeId: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, minimum: 1}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        criterionId: {type: string, pattern: '^[A-Za-z0-9._-]{1,64}$'}
    VerificationReview:
      type: object
      additionalProperties: false
      description: Derived support from this exact retained artifact and original package revisions. Never an overall acceptance, approval, merge or production outcome. No stored artifact/digest is rewritten.
      required: [schemaVersion, criteria, gaps]
      properties:
        schemaVersion: {type: integer, const: 1}
        criteria:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required: [requirement, description, state, reason, checkIds]
            properties:
              requirement: {$ref: '#/components/schemas/VerificationRequirement'}
              description: {type: string, minLength: 1, maxLength: 4096}
              state: {type: string, enum: [supported, not_verified]}
              reason: {type: string, enum: [unlinked, linked_check_not_verified, exact_revision_not_approved, declared_checks_passed]}
              checkIds: {type: array, maxItems: 16, items: {type: string, maxLength: 64}}
        gaps:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [package, state]
            properties:
              package: {$ref: '#/components/schemas/CoordinationPackagePin'}
              state: {type: string, enum: [criteria_absent, criteria_unavailable]}
