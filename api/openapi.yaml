              digest: {type: string, pattern: '^[a-f0-9]{64}$'}
              createdAt: {type: string, format: date-time}
        nextBefore: {type: string, maxLength: 1024}
    GraphQueryResult:
      type: object
      required: [graphId, digest, indexer, sources, nodes, edges, gaps, truncated]
      properties:
        graphId: {type: string, pattern: '^[a-f0-9]{32}$'}
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        indexer: {type: string}
        sources: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/GraphSourceRecord'}}
        nodes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GraphNode'}}
        edges: {type: array, maxItems: 8192, items: {$ref: '#/components/schemas/GraphEdge'}}
        gaps: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/GraphGap'}}
        truncated: {type: boolean}

    SourceBundleSummary:
      type: object
      required: [digest, tree, commit, size, fileCount, indexedFiles, truncated, createdAt]
      properties:
        digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        tree: {type: string, pattern: '^[a-f0-9]{40}$'}
        commit: {type: string, pattern: '^[a-f0-9]{40}$'}
        size: {type: integer, minimum: 1, maximum: 33554432}
        fileCount: {type: integer, minimum: 0}
        indexedFiles: {type: integer, minimum: 0, maximum: 512}
        truncated: {type: boolean}
        createdAt: {type: string, format: date-time}
