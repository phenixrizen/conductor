          maxLength: 128
        repositoryId:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          format: int64
          minimum: 1
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    CoordinationRepository:
      type: object
      additionalProperties: false
