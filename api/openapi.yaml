        - {name: depth, in: query, schema: {type: integer, minimum: 0, maximum: 5, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: Bounded structural evidence, content: {application/json: {schema: {$ref: '#/components/schemas/GraphQueryResult'}}}}
