    - $ref: '#/components/parameters/CollectionWorkspace'
    - $ref: '#/components/parameters/CollectionRepository'
    - $ref: '#/components/parameters/CSRF'
    get:
      summary: Read bounded retained source from an exact graph snapshot
      description: Holds current read permission on every graph repository in one transaction. The selected
        workspace and anchor stay fixed. Every source tuple field must equal the inspected graph; no implicit
        source refresh, provider request, Git bundle or credential is returned. Unknown/repeated query
        fields are rejected. A path outside retained coverage returns unavailable, not proof that the
        provider path is missing.
      security:
      - BearerAuth: []
      - BrowserCookie: []
      parameters:
      - name: graphDigest
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - name: repositoryId
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      - name: collectionId
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - name: receiptDigest
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - name: fullSourceDigest
        in: query
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
        description: Required exactly when the inspected graph source includes this full-source bundle
          digest
      - name: path
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 1024
        description: Literal clean relative path of at most 1024 UTF-8 bytes
      responses:
        '200':
          description: Retained artifact or explicit coverage gap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphArtifactResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
