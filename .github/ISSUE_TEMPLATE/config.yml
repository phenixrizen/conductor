# The issue chooser. A blank issue stays possible; the private channel for a
# vulnerability is offered before the task form (SECURITY.md).
blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability
    url: https://github.com/rocksolidlabs/conductor/security/advisories/new
    about: A vulnerability goes through GitHub's private vulnerability reporting, never an issue. SECURITY.md says what to include and what happens.
