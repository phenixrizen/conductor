name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: make web-build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make lint
      - run: make lint-static
      - run: go test -race -count=1 ./...
      - run: make build-go
      - run: python3 scripts/brand_assets.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-linux-amd64
          path: bin/conductor

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - run: make vuln

  build-matrix:
    # The server runs on Linux and macOS; Windows runs the Linux binary in
    # WSL2 through the desktop app, so there is no windows row.
    runs-on: ubuntu-latest
    needs: web
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build-go
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/conductor

  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make build-go
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run typecheck:e2e
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - run: make test-pebble
