name: Verify release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgres://conductor:conductor@127.0.0.1:55432/conductor?sslmode=disable
      CONDUCTOR_TEST_TEMPORAL: '1'
      CONDUCTOR_TEST_BROWSER: '1'
      CONDUCTOR_TEST_TERMINAL: '1'
      CONDUCTOR_TEST_PROCESS_RESTART: '1'
      CONDUCTOR_TEST_BACKUP: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start isolated CI database
        run: |
          docker run -d --name conductor-ci -e POSTGRES_USER=conductor -e POSTGRES_PASSWORD=conductor -e POSTGRES_DB=conductor -p 127.0.0.1:55432:5432 postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 -c max_locks_per_transaction=1024
          for attempt in $(seq 1 60); do
            if docker exec conductor-ci pg_isready -U conductor; then break; fi
            sleep 1
          done
          docker exec conductor-ci pg_isready -U conductor
      - name: Install bounded protocol test dependencies
        run: |
          scripts/install-ci-temporal.sh "$RUNNER_TEMP/temporal"
          echo "CONDUCTOR_TEMPORAL_CLI=$RUNNER_TEMP/temporal/temporal" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/pip" install openapi-spec-validator==0.9.0 playwright==1.62.0
          "$RUNNER_TEMP/checks/bin/python" -m playwright install --with-deps chromium
          echo "CONDUCTOR_BROWSER_PYTHON=$RUNNER_TEMP/checks/bin/python" >> "$GITHUB_ENV"
      - name: Web, contracts and source hygiene
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
          "$RUNNER_TEMP/checks/bin/openapi-spec-validator" api/openapi.yaml
          "$RUNNER_TEMP/checks/bin/openapi-spec-validator" api/webhooks.openapi.yaml
          "$RUNNER_TEMP/checks/bin/openapi-spec-validator" api/operations.openapi.yaml
          python3 scripts/check-docs.py
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          git diff --exit-code
      - name: Full normal, race, signed browser and durability suites
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Reproduce the committed release archive
        run: |
          scripts/build-release.sh "$RUNNER_TEMP/conductor-one.tar.gz"
          scripts/build-release.sh "$RUNNER_TEMP/conductor-two.tar.gz"
          cmp "$RUNNER_TEMP/conductor-one.tar.gz" "$RUNNER_TEMP/conductor-two.tar.gz"
          tar -xzf "$RUNNER_TEMP/conductor-one.tar.gz" -C "$RUNNER_TEMP"
          python3 scripts/check-release.py "$RUNNER_TEMP/conductor"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: conductor-linux-amd64
          path: ${{ runner.temp }}/conductor-one.tar.gz
          retention-days: 7
  isolated-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgres://conductor:conductor@127.0.0.1:55432/conductor?sslmode=disable
      CONDUCTOR_TEST_EXECUTION: '1'
      CONDUCTOR_TEST_CODEGRAPH: '1'
      CONDUCTOR_TEST_TEMPORAL: '1'
      CONDUCTOR_TEST_PROCESS_RESTART: '1'
      CONDUCTOR_TEST_DESIGN_EXECUTION: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.8'
      - name: Install exact tooling and start isolated database
        run: |
          python3 -m pip install --break-system-packages uv==0.11.25
          scripts/install-ci-temporal.sh "$RUNNER_TEMP/temporal"
          echo "CONDUCTOR_TEMPORAL_CLI=$RUNNER_TEMP/temporal/temporal" >> "$GITHUB_ENV"
          docker run -d --name conductor-ci -e POSTGRES_USER=conductor -e POSTGRES_PASSWORD=conductor -e POSTGRES_DB=conductor -p 127.0.0.1:55432:5432 postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 -c max_locks_per_transaction=1024
          for attempt in $(seq 1 60); do
            if docker exec conductor-ci pg_isready -U conductor; then break; fi
            sleep 1
          done
          docker exec conductor-ci pg_isready -U conductor
      - name: Build reviewed immutable worker images
        run: |
          scripts/build-worker-image.sh
          scripts/build-codegraph-image.sh
          worker_image=$(docker image inspect conductor-worker:local --format '{{.Id}}')
          CONDUCTOR_DESIGN_BASE_IMAGE="$worker_image" scripts/build-design-tools-image.sh
          echo "CONDUCTOR_TEST_WORKER_IMAGE=$worker_image" >> "$GITHUB_ENV"
          echo "CONDUCTOR_CODEGRAPH_IMAGE=$(docker image inspect conductor-codegraph:1.6.0 --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "CONDUCTOR_TEST_DESIGN_IMAGE=$(docker image inspect conductor-design-tools:1.0.6-0.13.0 --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Actual isolated coding, native graph, design and DAG recovery
        run: go test -race ./internal/execution ./internal/codegraph ./internal/coordinationworker ./internal/coordinationworkflow ./tests/acceptance -count=1
