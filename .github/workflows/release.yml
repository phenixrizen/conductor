name: release

# A tag v* builds the desktop packages (macOS dmg and zip, Linux deb, rpm and
# AppImage, Windows nsis with the Linux server for WSL) and attaches them to
# the GitHub release. Signing and notarisation run only when the secrets are
# there; the packages ship unsigned otherwise.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto # go.mod pins the patch toolchain; the go command fetches it

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  web:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make web-build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - name: server binaries for the packages (no make on the Windows runner)
        shell: bash
        run: |
          v=$(git describe --tags --always --dirty); c=$(git rev-parse --short HEAD)
          for t in linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/amd64/mac-x64 darwin/arm64/mac-arm64; do
            goos=${t%%/*}; rest=${t#*/}; goarch=${rest%%/*}; dir=bin/desktop/${rest#*/}; mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-X github.com/phenixrizen/conductor/internal/version.Version=$v -X github.com/phenixrizen/conductor/internal/version.Commit=$c" -o "$dir/conductor" ./cmd/conductor && echo "built $dir/conductor"
          done
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: package
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # A secret that is not set arrives as an empty variable, which electron-builder reads as a
          # certificate path; drop those, and do not search the keychain for an identity either.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v" || true
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          # The package version: the tag without its v (a release candidate is 0.6.0-rc.1), else 0.0.0 with the commit.
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            publish=always; ver="${GITHUB_REF_NAME#v}"
          else
            publish=never; ver="0.0.0-$(git rev-parse --short HEAD)"
          fi
          npx electron-builder --config electron-builder.yml --publish "$publish" -c.extraMetadata.version="$ver"
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-desktop-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.yml
          if-no-files-found: warn
