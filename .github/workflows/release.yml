name: release

# A dispatch with a version builds the desktop packages (macOS dmg and zip,
# Linux deb, rpm and AppImage, Windows nsis with the Linux server for WSL)
# from the commit it runs on and puts them on that version's draft release;
# without a version it builds them as this run's artifacts only. Signing and
# notarisation run only when the secrets are there; the packages ship
# unsigned otherwise.
#
#   gh workflow run release.yml --ref main -f version=0.7.0-rc.18
#
# No tag is pushed: the draft names v<version>, which does not exist yet, and
# the commit, and publishing the draft makes the tag there. A pushed tag is
# listed in the releases.atom the apps' updater reads even while its release
# is a draft, and an app whose channel's newest entry has no public
# latest.yml finds no update at all (#375). The draft is made once, before
# the package jobs, which upload to it by its id: electron-builder only
# builds, since publishing it made the release itself when it found none on
# the first page, and two jobs at once made two drafts (#372).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without its v (0.7.0-rc.18); empty builds the packages only
        required: false
        type: string

permissions:
  contents: write

# Two runs for one version would race to make its release as the package jobs did.
concurrency:
  group: release-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto # go.mod pins the patch toolchain; the go command fetches it
  # The input reaches a script only through the environment, never written into a run line;
  # release_draft.py refuses one that is not a version.
  VERSION: ${{ inputs.version }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  web:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make web-build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      # Skipped without a version, the job still succeeds: the package jobs need it.
      - name: the version's one draft release at this commit, made before the packages upload to it
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_draft.py ensure "v$VERSION" --target "$GITHUB_SHA"

  package:
    needs: [web, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5 # `python` on the three runners, for the upload
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - name: server binaries for the packages (no make on the Windows runner)
        shell: bash
        run: |
          # The server's version: what git describe said on a pushed tag, v and the version.
          if [ -n "$VERSION" ]; then v="v$VERSION"; else v=$(git describe --tags --always --dirty); fi
          c=$(git rev-parse --short HEAD)
          for t in linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/amd64/mac-x64 darwin/arm64/mac-arm64; do
            goos=${t%%/*}; rest=${t#*/}; goarch=${rest%%/*}; dir=bin/desktop/${rest#*/}; mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-X github.com/rocksolidlabs/conductor/internal/version.Version=$v -X github.com/rocksolidlabs/conductor/internal/version.Commit=$c" -o "$dir/conductor" ./cmd/conductor && echo "built $dir/conductor"
          done
          # The gate against a missed -X site: the linker ignores one for a symbol that no longer
          # exists, and the binary would say "dev (unknown)". The Linux runner runs its own package's
          # binary and compares the whole line; macOS is arm64 and Windows runs none of the four.
          if [ "$RUNNER_OS" = Linux ]; then
            got=$(bin/desktop/linux-x64/conductor version | sed -n 1p); want="conductor $v ($c)"
            if [ "$got" != "$want" ]; then echo "version gate: got '$got', want '$want'"; exit 1; fi
            echo "version gate: $got"
          fi
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: package
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # A secret that is not set arrives as an empty variable, which electron-builder reads as a
          # certificate path; drop those, and do not search the keychain for an identity either.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v" || true
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          # The package version: the version asked for (a release candidate is 0.7.0-rc.18), else 0.0.0 with the commit.
          if [ -n "$VERSION" ]; then
            ver="$VERSION"
          else
            ver="0.0.0-$(git rev-parse --short HEAD)"
          fi
          # Built only; the next step uploads. The latest*.yml and blockmaps are written all the same.
          npx electron-builder --config electron-builder.yml --publish never -c.extraMetadata.version="$ver"
      - name: upload to the version's draft release for this commit, by its id
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_draft.py upload "v$VERSION" desktop/release --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-desktop-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: warn

  release-check:
    if: inputs.version != ''
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: conductor-desktop-*
          path: packages
          merge-multiple: true
      - name: one draft release for this commit holds every package built, and no tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_draft.py check "v$VERSION" packages --target "$GITHUB_SHA"
