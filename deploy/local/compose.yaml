services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conductor
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ../../migrations:/docker-entrypoint-initdb.d:ro
